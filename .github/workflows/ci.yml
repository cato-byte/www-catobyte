name: CI/CD

# master is production: every push to master is tested, then deployed.
# Pull requests (and pushes to other branches) only run the tests.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (build the whole site; check links, metadata, translations)
        run: pytest -q
      - name: Build
        run: python -m sitegen build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://www.catobyte.co
    # One deploy at a time; a newer push waits for the running one instead of racing it.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # lets GitHub request short-lived AWS credentials (OIDC), no stored keys
    env:
      # Configured in GitHub: Settings > Environments > production > Variables.
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      PYTHON: python
    steps:
      - name: Skip until AWS access is configured
        if: env.AWS_DEPLOY_ROLE_ARN == '' || env.BUCKET == ''
        run: echo "::warning::Deploy skipped. Set AWS_DEPLOY_ROLE_ARN and S3_BUCKET in the production environment."
      - uses: actions/checkout@v4
        if: env.AWS_DEPLOY_ROLE_ARN != '' && env.BUCKET != ''
      - uses: actions/setup-python@v5
        if: env.AWS_DEPLOY_ROLE_ARN != '' && env.BUCKET != ''
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        if: env.AWS_DEPLOY_ROLE_ARN != '' && env.BUCKET != ''
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_DEPLOY_ROLE_ARN != '' && env.BUCKET != ''
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION || 'eu-west-3' }}
      - name: Deploy
        if: env.AWS_DEPLOY_ROLE_ARN != '' && env.BUCKET != ''
        run: ./scripts/deploy.sh
